[tools]
node = "latest"
oxfmt = "latest"
tombi = "latest"
oxlint = "latest"
markdownlint-cli2 = "latest"
pre-commit = "latest"

# emmet-language-server
"npm:@olrtg/emmet-language-server" = "latest"

# TypeScript
"npm:typescript" = "latest"
# For running TypeScript in Node
"npm:tsx" = "latest"

# The Rust based live-server is safer and faster
"cargo:live-server" = "latest"
marksman = "latest"

[tools.rust]
version = "stable"
components = ["clippy", "rustfmt"]
